name: PHP

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  cs:
    runs-on: ubuntu-latest
    name: Code Style

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run cs
      run: composer run cs

  phpstan:
    runs-on: ubuntu-latest
    name: Static Analysis

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run phpstan
      run: composer run phpstan

  phpunit:
    runs-on: ${{ matrix.os }}
    name: Integration Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            docker_host: unix:///var/run/docker.sock
          - os: windows-latest
            docker_host: tcp://localhost:2375

    steps:
    - uses: actions/checkout@v4

    - name: Configure Docker to use TCP (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        # Configure Docker daemon to listen on TCP
        $dockerConfig = @{ hosts = @("tcp://0.0.0.0:2375", "npipe:////./pipe/docker_engine") }
        $dockerConfig | ConvertTo-Json | Set-Content -Path "C:\ProgramData\docker\config\daemon.json"
        Restart-Service docker
        # Wait for Docker to be ready
        Start-Sleep -Seconds 5
      shell: pwsh

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        extensions: curl, pdo, pdo_mysql, pdo_pgsql, redis

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run test suite
      run: composer run integration
      env:
        DOCKER_HOST: ${{ matrix.docker_host }}
